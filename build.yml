name: Build NK Player APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses and install packages
        # ubuntu-latest already ships the Android SDK; no extra setup action needed
        run: |
          export SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Extract project zip if the project was uploaded as a .zip
        run: |
          if [ -z "$(find . -maxdepth 3 -name gradlew | head -1)" ]; then
            Z=$(ls ./*.zip 2>/dev/null | head -1)
            if [ -n "$Z" ]; then echo "Extracting $Z"; mkdir -p _src && unzip -q -o "$Z" -d _src; fi
          fi

      - name: Locate project directory (folder containing gradlew)
        run: |
          GW=$(find . -maxdepth 3 -name gradlew -not -path '*/node_modules/*' | head -1)
          if [ -z "$GW" ]; then echo "gradlew not found in repo"; ls -R | head -50; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$GW")" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nk-player-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: nk-player-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
