name: Build NOXPLAY Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: noxplay-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unzip source and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository (workflow and uploaded ZIP)
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find . -maxdepth 1 -type f -iname '*.zip' -not -name 'build-output.zip' | sort)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "No source ZIP found in repository root. Upload your source ZIP beside the .github folder."
            exit 1
          fi
          if [ "${#zips[@]}" -gt 1 ]; then
            echo "More than one ZIP found in repository root. Keep only the source ZIP to avoid building the wrong archive."
            printf 'Found: %s\n' "${zips[@]}"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/noxplay-source"
          unzip -q "${zips[0]}" -d "$RUNNER_TEMP/noxplay-source"
          SETTINGS_FILE=$(find "$RUNNER_TEMP/noxplay-source" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Could not find settings.gradle or settings.gradle.kts inside the ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project root: $PROJECT_DIR"
          echo "Detected project files:"
          ls -la "$PROJECT_DIR" | head -40

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :application:vlc-android:assembleDebug

      - name: Collect APK files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find "${{ steps.source.outputs.project_dir }}" -type f -name '*.apk' -path '*/build/outputs/apk/*' -exec cp -v {} "$GITHUB_WORKSPACE/apk-output/" \;
          if [ -z "$(find "$GITHUB_WORKSPACE/apk-output" -type f -name '*.apk' -print -quit)" ]; then
            echo "Build completed but no APK was found in the expected output folders."
            exit 1
          fi
          ls -lh "$GITHUB_WORKSPACE/apk-output"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NOXPLAY-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
